name: research-distributed-continuity

on:
  push:
    branches: [ main, "dev/adaptive-research" ]
  pull_request:
    branches: [ main ]

jobs:
  validate-distributed-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate distributed research continuity architecture
        run: python3 scripts/validate_research_distributed_continuity.py data/research/v1
      - name: Run distributed research continuity benchmarks
        run: python3 scripts/validate_research_distributed_continuity_benchmarks.py data/research/v1
