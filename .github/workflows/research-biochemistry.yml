name: research-biochemistry

on:
  push:
    branches: [ main, "dev/adaptive-research" ]
  pull_request:
    branches: [ main ]

jobs:
  validate-biochemistry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate alternative biochemistry research
        run: python3 scripts/validate_research_biochemistry.py data/research/v1
