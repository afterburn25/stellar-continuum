name: build

on:
  push:
    branches: [ main, integration, "dev/**", "docs/**", "work/**" ]
  pull_request:
    branches: [ main, integration ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate visual asset contract
        run: python3 scripts/validate_visual_assets.py

      - name: Verify visual contract regression checks
        run: python3 scripts/test_validate_visual_assets.py

      - name: Validate adaptive research catalog
        run: python3 scripts/validate_research_catalog.py data/research/v1

      - name: Validate research maturation and capabilities
        run: python3 scripts/validate_research_maturation.py data/research/v1

      - name: Validate research competence and expertise
        run: python3 scripts/validate_research_competence.py data/research/v1

      - name: Validate foreign technology transfer and research UI
        run: python3 scripts/validate_research_transfer_ui.py data/research/v1

      - name: Validate starting research profiles and runtime contracts
        run: python3 scripts/validate_research_start_runtime.py data/research/v1

      - name: Validate research agenda, scientific culture, and AI planning
        run: python3 scripts/validate_research_agenda_ai.py data/research/v1

      - name: Run long-horizon Adaptive Research benchmarks
        run: python3 scripts/validate_research_benchmarks.py data/research/v1

      - name: Restore
        run: dotnet restore Game.csproj

      - name: Build
        run: dotnet build Game.csproj --configuration Release --no-restore

      - name: Build assembly loaded by the Godot project runner
        # The ordinary editor/project runner loads Debug; Release validation remains above.
        run: dotnet build Game.csproj --configuration Debug --no-restore

      - name: Validate Godot smoke failure detection
        run: python3 -m unittest discover -s tests/GodotSmokeChecks -p 'test_*.py'

      - name: Core simulation integration validation
        run: dotnet run --project tests/Game.Simulation.Validation/Game.Simulation.Validation.csproj --configuration Release

      - name: Diplomacy workspace and command lifecycle validation
        run: dotnet run --project tests/DiplomacyWorkspace.Validation/DiplomacyWorkspace.Validation.csproj --configuration Release

      - name: Massive combat simulation validation
        run: dotnet run --project tests/Game.MassiveCombat.Validation/Game.MassiveCombat.Validation.csproj --configuration Release

      - name: Combat campaign persistence and observer privacy validation
        run: dotnet run --project tests/Game.MassiveCombat.Persistence.Validation/Game.MassiveCombat.Persistence.Validation.csproj --configuration Release

      - name: Core runtime orchestration validation
        run: dotnet run --project tests/Game.CoreRuntime.Validation/Game.CoreRuntime.Validation.csproj --configuration Release

      - name: Fair-information and long-run quality validation
        run: dotnet run --project tests/Game.Quality.Validation/Game.Quality.Validation.csproj --configuration Release

      - name: Logistics flow validation
        run: dotnet run --project tests/Game.Logistics.Validation/Game.Logistics.Validation.csproj --configuration Release

      - name: Territorial control, expansion, persistence, AI and scale validation
        run: dotnet run --project tests/Game.Territory.Validation/Game.Territory.Validation.csproj --configuration Release

      - name: Restore species mechanics checks
        run: dotnet restore tests/SpeciesMechanicsChecks/SpeciesMechanicsChecks.csproj

      - name: Run species mechanics checks
        run: dotnet run --project tests/SpeciesMechanicsChecks/SpeciesMechanicsChecks.csproj --configuration Release --no-restore

      - name: Download Godot 4.7.2 .NET
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-ci
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d .godot-ci
          GODOT_BIN="$(find .godot-ci -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Godot headless editor smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-artifacts
          timeout 120s "$GODOT_BIN" --headless --audio-driver Dummy --path . --editor --import \
            2>&1 | tee smoke-artifacts/editor.log
          python3 scripts/validate_godot_smoke.py smoke-artifacts/editor.log

      - name: Godot headless runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-artifacts
          timeout 45s "$GODOT_BIN" --headless --audio-driver Dummy --path . -- --stellar-startup-smoke \
            2>&1 | tee smoke-artifacts/runtime.log
          python3 scripts/validate_godot_smoke.py smoke-artifacts/runtime.log --require-runtime-ready

      - name: Upload Godot smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-smoke-${{ github.run_number }}-${{ github.run_attempt }}
          path: smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 14
