name: research-biochemistry-benchmark

on:
  push:
    branches: [ main, "dev/adaptive-research" ]
  pull_request:
    branches: [ main ]

jobs:
  validate-biochemistry-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate biochemical shared-graph applicability benchmark
        run: python3 scripts/validate_research_biochemistry_benchmarks.py data/research/v1
