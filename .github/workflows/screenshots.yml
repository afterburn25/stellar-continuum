name: Game Screenshot Capture

on:
  workflow_dispatch:
  pull_request:
    branches: [ integration ]
  push:
    branches:
      - integration
      - work/screenshot-capture
      - work/visual-style-assets
      - work/core-game-integration
      - work/testing-release-qa

permissions:
  contents: read

concurrency:
  group: game-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    # Software-rendered surface, Mars, resolution, and save/reload captures can exceed
    # ten minutes; leave setup/import/upload headroom around the bounded game run.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate screenshot and runtime evidence contracts
        run: python3 -B -m unittest discover -s tests/GodotSmokeChecks -v

      - name: Restore and build game
        run: |
          set -euo pipefail
          dotnet restore Game.csproj
          dotnet build Game.csproj --configuration Release --no-restore
          # Godot's ordinary project runner loads the Debug C# assembly. Build it explicitly
          # so scene scripts can actually instantiate during visual capture.
          dotnet build Game.csproj --configuration Debug --no-restore

      - name: Install virtual display dependencies
        run: |
          set -euo pipefail
          # Runner images include third-party feeds that these Ubuntu packages do not use.
          # Restrict refreshes to the canonical Ubuntu feed so a stale Chrome/Microsoft
          # mirror cannot prevent the game screenshot check from starting.
          APT_UBUNTU=(-o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
                      -o Dir::Etc::sourceparts="-" \
                      -o APT::Get::List-Cleanup="0" \
                      -o Acquire::Retries="3")
          sudo apt-get "${APT_UBUNTU[@]}" update
          sudo apt-get "${APT_UBUNTU[@]}" install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Download Godot 4.7.2 .NET
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-ci
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d .godot-ci
          GODOT_BIN="$(find .godot-ci -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Complete asset import before screenshot startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshot-artifacts
          timeout 120s "$GODOT_BIN" --headless --audio-driver Dummy --path . --editor --import \
            2>&1 | tee screenshot-artifacts/godot-import.log
          python3 scripts/validate_godot_smoke.py screenshot-artifacts/godot-import.log

      - name: Capture diplomacy at native 720p and 1080p
        shell: bash
        run: |
          set -euo pipefail
          for resolution in 1280x720 1920x1080; do
            xvfb-run -a -s "-screen 0 1920x1080x24" \
              python3 scripts/capture_diplomacy.py --godot "$GODOT_BIN" \
              --output "screenshot-artifacts/diplomacy-$resolution" --resolution "$resolution"
          done

      - name: Capture real game screenshots
        shell: bash
        env:
          STELLAR_SCREENSHOT_DIR: ${{ github.workspace }}/screenshot-artifacts
          STELLAR_CAPTURE_SHA: ${{ github.sha }}
          XDG_DATA_HOME: ${{ runner.temp }}/stellar-screenshot-user-data
        run: |
          set -euo pipefail
          mkdir -p "$STELLAR_SCREENSHOT_DIR"
          # Bounded camera transitions and normal surface construction run on a software-rendered 3D viewport.
          # Include native 1080p/1440p/4K captures after the 720p gameplay journey.
          # Bound the full software-rendered capture, including late surface and resolution
          # evidence, to twenty minutes; the job timeout above covers setup and upload.
          timeout 1200s xvfb-run -a -s "-screen 0 3840x2160x24" \
            "$GODOT_BIN" \
            --audio-driver Dummy \
            --path . \
            --resolution 1280x720 \
            --rendering-method gl_compatibility \
            tools/ScreenshotCapture.tscn \
            2>&1 | tee "$STELLAR_SCREENSHOT_DIR/godot-capture.log"

      - name: Capture nearby catalogue and species selection
        shell: bash
        run: |
          set -euo pipefail
          for focus in nearby-catalog species-selector; do
            output="$GITHUB_WORKSPACE/screenshot-artifacts/$focus"
            mkdir -p "$output"
            STELLAR_CAPTURE_FOCUS="$focus" STELLAR_SCREENSHOT_DIR="$output" \
              STELLAR_CAPTURE_SHA="${{ github.sha }}" XDG_DATA_HOME="$RUNNER_TEMP/stellar-$focus" \
              timeout 240s xvfb-run -a -s "-screen 0 1920x1080x24" \
              "$GODOT_BIN" --audio-driver Dummy --path . --resolution 1280x720 \
              --rendering-method gl_compatibility tools/ScreenshotCapture.tscn \
              2>&1 | tee "$output/godot-capture.log"
            python3 scripts/validate_godot_smoke.py "$output/godot-capture.log"
            python3 -c 'import pathlib,sys; log=pathlib.Path(sys.argv[1]).read_text(); marker="STELLAR_FOCUSED_"+sys.argv[2].replace("-","_").upper()+"_COMPLETE"; assert marker in log, marker' "$output/godot-capture.log" "$focus"
          done

      - name: Validate screenshot output
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_screenshot_capture.py screenshot-artifacts --expected-sha "${{ github.sha }}"

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-continuum-screenshots-${{ github.run_number }}
          path: screenshot-artifacts/
          if-no-files-found: warn
          retention-days: 30
