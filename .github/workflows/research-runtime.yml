name: research-runtime

on:
  push:
    branches:
      - dev/adaptive-research
  pull_request:
    branches:
      - main

jobs:
  validate-adaptive-research-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Adaptive Research runtime checks
        run: dotnet restore tests/AdaptiveResearchRuntimeChecks/AdaptiveResearchRuntimeChecks.csproj
      - name: Build Adaptive Research runtime checks
        run: dotnet build tests/AdaptiveResearchRuntimeChecks/AdaptiveResearchRuntimeChecks.csproj --configuration Release --no-restore
      - name: Run Adaptive Research runtime checks
        run: dotnet run --project tests/AdaptiveResearchRuntimeChecks/AdaptiveResearchRuntimeChecks.csproj --configuration Release --no-build
