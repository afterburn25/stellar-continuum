name: research-collaboration

on:
  push:
    branches: [ main, "dev/adaptive-research" ]
  pull_request:
    branches: [ main ]

jobs:
  validate-research-collaboration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate joint research collaboration architecture
        run: python3 scripts/validate_research_collaboration.py data/research/v1
      - name: Run joint research collaboration benchmarks
        run: python3 scripts/validate_research_collaboration_benchmarks.py data/research/v1
